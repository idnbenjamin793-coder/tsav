<style>
/* Appli une colonne, max 560px, onglets fixes en bas. Olive nuit + sable + orange signal */
:root{
  --bg:#12160f; --panel:#1b2117; --panel2:#232b1e; --line:#323d2b; --fg:#ece6d6; --muted:#9aa48c;
  --sand:#d9c89e; --sig:#ff8a3d; --ok:#8fd16a;
  --display:"Big Shoulders Display",Impact,sans-serif; --body:Inter,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 90px) max(16px,env(safe-area-inset-left))}
h1,h2,h3{font-family:var(--display);font-weight:900;letter-spacing:.01em;margin:0;text-wrap:balance;text-transform:uppercase}
h1{font-size:44px;line-height:.95}
h2{font-size:28px;margin:22px 0 10px}
h3{font-size:20px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--sand);font-weight:700}
.muted{color:var(--muted);font-size:13.5px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.btn{background:var(--sig);color:#1a0d02;font-weight:700;padding:14px 18px;border-radius:10px;font-size:16px;width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn2{background:transparent;border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-weight:600}
input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--fg);padding:12px;border-radius:10px;font:inherit}
label{display:block;font-weight:600;margin:14px 0 6px}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}

/* Choix d'unité */
.cat{margin:18px 0 8px}
.units{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.unit{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.unit b{font-family:var(--display);font-size:19px;text-transform:uppercase;line-height:1.05}
.unit .heb{color:var(--sand);font-size:13px}
.unit small{color:var(--muted);font-size:12px}
.unit.sel{border-color:var(--sig);background:var(--panel2)}
.steps{display:flex;gap:6px;margin:14px 0 18px}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--sig)}

/* Tableau de bord */
.hero{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-bottom:14px}
.count{text-align:right}
.count b{font-family:var(--display);font-size:48px;line-height:1;color:var(--sig);font-variant-numeric:tabular-nums}
.count small{display:block;color:var(--muted);font-size:12px}
.bar{height:8px;background:var(--bg);border-radius:9px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--sand);border-radius:9px}
.phase{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--sand)}
.phase.found{color:var(--muted)} .phase.dev{color:var(--sand)} .phase.spec{color:var(--ok)} .phase.taper{color:var(--sig)}
.strip{display:flex;gap:3px;margin-top:12px}
.strip i{flex:1;height:10px;border-radius:3px;background:var(--line)}
.strip i.dev{background:#6d6448} .strip i.spec{background:#4f7a3a} .strip i.taper{background:#8a4f22}
.strip i.cur{outline:2px solid var(--fg);outline-offset:1px}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:8px}
.goals div{background:var(--bg);border-radius:10px;padding:8px 10px}
.goals small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.goals b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.goals span{font-size:11px;color:var(--muted)}
details.card{padding:0}
summary{list-style:none;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer}
summary::-webkit-details-marker{display:none}
.day{width:44px;flex:none;text-align:center;font-family:var(--display);font-size:15px;color:var(--muted);text-transform:uppercase;line-height:1.1}
.day b{display:block;font-size:22px;color:var(--fg)}
.st{flex:1;min-width:0}
.st b{display:block;font-size:16px}
.st small{color:var(--muted)}
.tick{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:900}
.done .tick{background:var(--ok);border-color:var(--ok);color:#10200a}
.done .st b{color:var(--muted);text-decoration:line-through}
.sb{padding:0 14px 14px 70px}
.sb ol{margin:0 0 12px;padding-left:18px}
.sb li{margin:3px 0}
.tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--sig)}
.opt{opacity:.75}

/* Tests */
.tgrid{display:flex;justify-content:space-between;gap:10px}
.tgrid b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}
svg.spark{width:100%;height:46px;display:block;margin-top:8px}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;padding:6px max(8px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 6px) max(8px,env(safe-area-inset-left));z-index:10}
.tabs button{flex:1;padding:10px 4px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted);background:transparent}
.tabs button.on{color:var(--fg);background:var(--panel2)}
ul.focus{margin:6px 0 0;padding-left:18px}
.warn{border-color:#5a4423;background:#211a10}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translateX(-50%);background:var(--ok);color:#10200a;font-weight:700;padding:8px 16px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
/* Aujourd'hui */
.today{border-color:var(--sig)}
.today h3{font-size:26px;margin-top:4px}
.sb .row{flex-wrap:wrap}
/* Séance guidée */
#player{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 14px) max(16px,env(safe-area-inset-left))}
.pl-top{display:flex;justify-content:space-between;align-items:center;max-width:560px;width:100%;margin:0 auto}
.pl-clock{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;color:var(--muted)}
.pl-body{flex:1;max-width:560px;width:100%;margin:16px auto 0}
.pl-dots{display:flex;gap:5px;margin:14px 0}
.pl-dots i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.pl-dots i.d{background:var(--ok)} .pl-dots i.c{background:var(--sig)}
.pl-step{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.pl-step small{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:700}
.pl-step p{font-size:21px;line-height:1.4;margin:8px 0 0;font-weight:500}
.pl-rest{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.pl-rest .row{flex-wrap:wrap}
.pl-timer{font-family:var(--display);font-size:84px;line-height:1;color:var(--sig);font-variant-numeric:tabular-nums;text-align:center}
.pl-nav{display:flex;gap:8px;max-width:560px;width:100%;margin:16px auto 0}
.pl-nav .btn{flex:1;width:auto}
.pl-fb{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pl-fb button{padding:14px 6px}
.pl-fb .btn{width:auto}
/* Moi */
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mstats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center}
.mstats b{display:block;font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums}
.mstats small{color:var(--muted);font-size:12px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.badge{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;opacity:.45}
.badge.on{opacity:1;border-color:var(--sand)}
.badge i{font-style:normal;font-size:24px;display:block}
.badge b{display:block;font-size:13px;margin-top:4px}
.badge small{color:var(--muted);font-size:11px;line-height:1.3;display:block}
label.file{display:inline-flex;align-items:center;margin:0;cursor:pointer}
/* Accueil */
.welcome h1{font-size:54px;margin-top:10px}
.feat{list-style:none;padding:0;margin:18px 0;display:grid;gap:8px}
.feat li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.feat b{display:block}
.feat span{color:var(--muted);font-size:13.5px}
.trust{font-size:12.5px;color:var(--muted);text-align:center;margin-top:12px}
@media (max-width:380px){ .units{grid-template-columns:1fr} h1{font-size:38px} .welcome h1{font-size:44px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="prog" class="on">Programme</button>
  <button data-tab="tests">Tests</button>
  <button data-tab="gib">Gibbush</button>
  <button data-tab="moi">Moi</button>
</nav>
<div id="player" hidden></div>

<script>
"use strict";
// ================= Données des unités =================
// tier : 1 élite, 2 brigade / génie, 3 bataillons mixtes et autres corps
// p : poids de l'entraînement (0 à 3) — end endurance, spd vitesse, str force, carry port de charge, swim natation
const UNITS = [
  {id:"matkal",  n:"Sayeret Matkal", h:"סיירת מטכ\"ל", cat:"Unités d'élite", tier:1, p:{end:3,spd:3,str:2,carry:3,swim:0},
   d:"Unité de reconnaissance de l'état-major.", f:["Endurance sur la durée et répétition des efforts","Sprints avec sacs de sable","Résistance mentale quand tu es épuisé","Travail d'équipe et calme sous la pression"]},
  {id:"s13",     n:"Shayetet 13", h:"שייטת 13", cat:"Unités d'élite", tier:1, p:{end:3,spd:2,str:2,carry:2,swim:3},
   d:"Commando marine.", f:["Natation : aisance et endurance dans l'eau","Course et efforts répétés","Résistance au froid et à la fatigue","Mental : ne jamais abandonner"]},
  {id:"shaldag", n:"Shaldag", h:"שלדג", cat:"Unités d'élite", tier:1, p:{end:3,spd:3,str:2,carry:3,swim:0},
   d:"Unité commando de l'armée de l'air.", f:["Endurance et sprints","Port de charge lourde","Résistance mentale","Travail en équipe"]},
  {id:"669",     n:"Unité 669", h:"יחידה 669", cat:"Unités d'élite", tier:1, p:{end:3,spd:2,str:2,carry:3,swim:2},
   d:"Unité de sauvetage et d'évacuation de l'armée de l'air.", f:["Port de brancard et de blessé","Endurance longue","Calme et précision sous la fatigue"]},
  {id:"duvdevan",n:"Duvdevan", h:"דובדבן", cat:"Unités d'élite", tier:1, p:{end:3,spd:3,str:2,carry:2,swim:0},
   d:"Unité commando spécialisée dans les opérations sous couverture.", f:["Sprints et explosivité","Endurance","Lucidité sous la pression"]},
  {id:"maglan",  n:"Maglan", h:"מגלן", cat:"Unités d'élite", tier:1, p:{end:3,spd:2,str:2,carry:3,swim:0},
   d:"Unité commando d'opérations en profondeur.", f:["Marches longues avec sac lourd","Endurance","Mental"]},
  {id:"egoz",    n:"Egoz", h:"אגוז", cat:"Unités d'élite", tier:1, p:{end:3,spd:2,str:2,carry:3,swim:0},
   d:"Unité commando spécialisée en terrain difficile.", f:["Marches en terrain accidenté avec charge","Sprints","Mental et cohésion"]},
  {id:"yahalom", n:"Yahalom", h:"יהל\"ם", cat:"Unités d'élite", tier:1, p:{end:2,spd:2,str:3,carry:3,swim:0},
   d:"Unité d'élite du génie de combat.", f:["Force et port de charge","Endurance","Calme et précision"]},
  {id:"oketz",   n:"Oketz", h:"עוקץ", cat:"Unités d'élite", tier:1, p:{end:3,spd:2,str:2,carry:2,swim:0},
   d:"Unité cynophile (avec des chiens).", f:["Endurance de course","Port de charge","Patience et sang-froid"]},

  {id:"golani",  n:"Golani", h:"גולני", cat:"Brigades d'infanterie", tier:2, p:{end:2,spd:2,str:2,carry:3,swim:0},
   d:"Brigade d'infanterie, béret marron.", f:["Port de charge et marches","Sprints courts","Esprit d'équipe"]},
  {id:"givati",  n:"Givati", h:"גבעתי", cat:"Brigades d'infanterie", tier:2, p:{end:2,spd:2,str:2,carry:3,swim:0},
   d:"Brigade d'infanterie, béret violet.", f:["Port de charge et marches","Endurance","Esprit d'équipe"]},
  {id:"tsanhanim",n:"Tsanhanim", h:"צנחנים", cat:"Brigades d'infanterie", tier:2, p:{end:3,spd:2,str:2,carry:3,swim:0},
   d:"Brigade parachutiste, béret rouge.", f:["Endurance","Port de charge","Mental"]},
  {id:"nahal",   n:"Nahal", h:"נח\"ל", cat:"Brigades d'infanterie", tier:2, p:{end:2,spd:2,str:2,carry:3,swim:0},
   d:"Brigade d'infanterie, béret vert clair.", f:["Marches avec charge","Endurance","Esprit d'équipe"]},
  {id:"kfir",    n:"Kfir", h:"כפיר", cat:"Brigades d'infanterie", tier:2, p:{end:2,spd:2,str:2,carry:3,swim:0},
   d:"Brigade d'infanterie, béret camouflage.", f:["Marches avec charge","Endurance","Esprit d'équipe"]},

  {id:"karakal", n:"Karakal", h:"קרקל", cat:"Bataillons mixtes", tier:3, p:{end:2,spd:2,str:2,carry:2,swim:0},
   d:"Bataillon mixte (filles et garçons) de défense des frontières.", f:["Endurance","Port de charge","Esprit d'équipe"]},
  {id:"bardelas",n:"Bardelas", h:"ברדלס", cat:"Bataillons mixtes", tier:3, p:{end:2,spd:2,str:2,carry:2,swim:0},
   d:"Bataillon mixte de défense des frontières.", f:["Endurance","Port de charge","Esprit d'équipe"]},
  {id:"arayot",  n:"Arayot HaYarden", h:"אריות הירדן", cat:"Bataillons mixtes", tier:3, p:{end:2,spd:2,str:2,carry:2,swim:0},
   d:"Bataillon mixte de défense des frontières.", f:["Endurance","Port de charge","Esprit d'équipe"]},

  {id:"handasa", n:"Génie de combat", h:"הנדסה קרבית", cat:"Autres corps combattants", tier:2, p:{end:2,spd:1,str:3,carry:3,swim:0},
   d:"Génie de combat : ouverture de passages, explosifs.", f:["Force et port de matériel lourd","Endurance","Travail d'équipe"]},
  {id:"shiryon", n:"Blindés", h:"שריון", cat:"Autres corps combattants", tier:3, p:{end:1,spd:1,str:3,carry:2,swim:0},
   d:"Corps blindé : les chars.", f:["Force du haut du corps (obus, chenilles)","Gainage et dos solide","Endurance de base"]},
  {id:"totchanim",n:"Artillerie", h:"תותחנים", cat:"Autres corps combattants", tier:3, p:{end:1,spd:1,str:3,carry:2,swim:0},
   d:"Corps d'artillerie.", f:["Force et port d'obus","Gainage","Endurance de base"]},
];
// Objectifs indicatifs par tier : [_, élite, brigade, autres]. t:null = aucun barème public trouvé
const TESTS = [
  {id:"run2k",   n:"2 km chrono",          time:true, lower:true, t:[0,450,495,570]},
  {id:"run3k",   n:"3 km chrono",          time:true, lower:true, t:[0,900,900,900], only:["tsanhanim"], note:"Course de tri citée par des sites de prépa : moins de 15 min"},
  {id:"pushups", n:"Pompes en 2 min",      t:[0,70,55,40]},
  {id:"situps",  n:"Abdos en 2 min",       t:[0,80,65,50]},
  {id:"pullups", n:"Tractions (max)",      t:[0,16,10,5]},
  {id:"swim400", n:"400 m nage libre",     time:true, lower:true, t:null, only:["s13","669"], note:"Distance citée pour le gibbush Shayetet. Pas de temps officiel publié : bats ton propre record"},
];

// Parcours vérifié par unité (recherche du 22/11/2026). conf : "off" source officielle Tsahal, "prep" sites de prépa / presse, "low" très peu d'infos publiques
const S_YS = ["Tsahal (mitgaisim) : tout sur le Yom Sayarot, 2026", "https://www.mitgaisim.idf.il/כתבות/ראשי/כל-מה-שצריך-לדעת-על-יום-הסיירות/"];

const S_PROF = ["Wikipedia : profil médical", "https://en.wikipedia.org/wiki/Medical_profile"];
const GM_ROUTE = ["Yom Sayarot : journée de tri physique et mentale (en octobre de nuit, ou en janvier sur une journée)", "Gibbush Matkal : environ 4 à 5 jours, commun à Sayeret Matkal, Shaldag, 669 et aux unités de la brigade Commando", "Puis tests psychologiques, médicaux et de sécurité"];

const INFO = {
  matkal:  {conf:"off", prof:"97", route:GM_ROUTE, acts:GM_ACTS, src:[S_YS, ["Wikipedia : Sayeret Matkal","https://en.wikipedia.org/wiki/Sayeret_Matkal"], S_GM]},
  shaldag: {conf:"prep", prof:"97", route:GM_ROUTE.concat("Sayeret Matkal et Shaldag choisissent leurs candidats en premier"), acts:GM_ACTS, src:[S_GM, S_GM2]},
  "669":   {conf:"prep", prof:"97", route:GM_ROUTE.concat("Une journée piscine en plus (yom breikha) : équipes de 10 en eau profonde"), acts:GM_ACTS.concat("Ouvrir et refermer le brancard spécial 669 en temps limité, sous pression"), src:[["Wikipedia : Unité 669","https://en.wikipedia.org/wiki/Unit_669"], ["Adrenalin : journée piscine 669","https://adrenalin-israel.co.il/pool-day-669-unit/"], S_GM]},
  maglan:  {conf:"prep", prof:"97", route:["Candidats choisis après le Gibbush Matkal (Yom Sayarot d'abord), par un tirage entre les unités environ une semaine après"], acts:GM_ACTS, src:[S_GM, ["Wikipedia : brigade Oz (Commando)","https://en.wikipedia.org/wiki/Oz_Brigade"]]},

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const unitOf = id => UNITS.find(u => u.id === id);
const mmss = s => Math.floor(s/60)+":"+String(Math.round(s%60)).padStart(2,"0");
function parseTime(v){ const m = String(v).trim().match(/^(\d{1,2})[:.,h'](\d{2})$/); return m ? +m[1]*60 + +m[2] : null; }
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("on"),1500); }

// ================= Générateur de programme =================
function levelFrom(run, push){
  const parts = [];
  const r = parseTime(run); if (r) parts.push(r < 510 ? 2 : r < 600 ? 1 : 0);
  const p = parseInt(push, 10); if (p >= 0) parts.push(p >= 45 ? 2 : p >= 25 ? 1 : 0);
  if (!parts.length) return 0;
  return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length);
}
function weeksFor(dateStr){
  if (!dateStr) return 12;
  const w = Math.floor((new Date(dateStr+"T08:00") - Date.now())/(7*DAY));
  return Math.max(4, Math.min(16, w));
}

// ---------- Phases ----------
const BLOCKS = { found:"Fondations", dev:"Développement", spec:"Spécifique gibbush", taper:"Affûtage" };
function blockOf(w, N){
  if (w === N) return "taper";
  const f = (w-1) / Math.max(1, N-2);
  return f < .34 ? "found" : f < .67 ? "dev" : "spec";
}
function isLight(w, N){ return w < N && w % 4 === 0; }
function weekOfDate(d){ return Math.max(1, Math.floor((d - S.start)/(7*DAY)) + 1); }

// ---------- Paliers : du niveau actuel jusqu'à l'objectif ----------
// Point de départ estimé selon le niveau, si aucun test n'est noté
const START_EST = { run2k:[660,570,500], run3k:[1050,900,790], pushups:[12,25,45], situps:[20,35,55], pullups:[0,4,10], swim400:[600,480,400] };
function goalOf(id){ const t = TESTS.find(x => x.id === id); return t && t.t ? t.t[unitOf(S.unit).tier] : null; }
// Ligne droite entre le dernier résultat noté et l'objectif, atteint l'avant-dernière semaine.
// Quand tu notes un nouveau test, tout se recalcule à partir de lui.
function milestone(id, w){
  const t = TESTS.find(x => x.id === id), end = Math.max(2, S.weeks - 1);
  const rec = S.tests.filter(x => x.id === id);
  let a, wa;
  if (rec.length){ const last = rec[rec.length-1]; a = last.v; wa = Math.min(end-1, weekOfDate(last.d)); }
  else { a = START_EST[id][S.level]; wa = 1; }
  let g = goalOf(id);
  if (g === null) g = t.lower ? Math.round(a*.9) : Math.round(a*1.2);                    // pas de barème : 10 à 20 % de mieux
  if (t.lower ? a <= g : a >= g) g = t.lower ? Math.round(a*.97) : Math.ceil(a*1.1 + 1); // objectif déjà atteint : on continue
  if (w <= wa) return a;
  const f = Math.min(1, (w - wa) / Math.max(1, end - wa));
  // Progression réaliste maximale par semaine, pour éviter les blessures
  const cap = WEEKLY_CAP[id] * (Math.min(w, end) - wa);
  const step = Math.min(Math.abs(g - a) * f, cap);
  return Math.round(a + Math.sign(g - a) * step);
}
const WEEKLY_CAP = { run2k:12, run3k:18, pushups:3, situps:3, pullups:1, swim400:10 };
// Vrai si l'objectif de l'unité ne peut pas être atteint à temps avec une progression réaliste
function goalTooFar(id){ const g = goalOf(id); return g !== null && finalGoal(id) !== g && !(TESTS.find(x=>x.id===id).lower ? finalGoal(id) < g : finalGoal(id) > g); }

    if (S.unit === "shiryon" || S.unit === "totchanim"){
      const it = B === "found"
        ? [n(4,6)+" × 30 m en portant deux sacs lourds", "3 × 10 soulevés de terre d'un sac de "+sk+" kg, dos bien droit", n(5,7)+" sprints de 50 m", "Gainage 3 × "+n(30,60)+" s"]
        : B === "dev"
        ? [n(5,8)+" × 40 m en portant deux jerricans", "4 × 8 épaulés d'un sac de "+sk+" kg (du sol jusqu'aux épaules)", "3 × 10 montées sur une chaise avec le sac", "Gainage latéral 3 × "+n(20,45)+" s"]
        : ["4 tours sans pause : 40 m avec jerricans, 10 épaulés du sac de "+sk+" kg, 10 burpees, 50 m de sprint", "Gainage avec touches d'épaules : "+n(20,40)];
      return { t:"Circuit combat", m:45, tag:"Physique du poste · "+T, items: it.concat("En général, pas de gibbush pour ces postes : on prépare le corps aux classes et au travail sur le char ou le canon")};
    }
    if (B === "found") return { t:"Technique gibbush", m:40, tag:"Spécial gibbush · "+T, items:[
      n(5,8)+" sprints de 30 m, départ couché au sol, au signal",
      "Reptation, 4 × 10 m : corps à plat, tu avances coude et genou opposés. Lentement, la technique d'abord",
      "Marche de l'ours, 3 × 15 m (à quatre pattes, genoux décollés)",
      "3 × 20 m en portant un sac de "+sk+" kg sur l'épaule, puis tu changes d'épaule",
      "Pas de chrono dans cette phase : apprends les mouvements"]};
    if (B === "dev") return { t:"Simulation gibbush", m:50, tag:"Spécial gibbush · "+T, items:[
      n(8,12)+" sprints de 50 m, départ couché au sol",
      "Le triangle, "+n(3,5)+" fois : 15 m de reptation, 15 m en portant un sac de "+sk+" kg, 15 m de sprint",
      "Tenir le sac au-dessus de la tête : 3 × "+n(20,45)+" s",
      n(15,25)+" burpees",
      "À 4 si tu peux : porter un brancard lesté (ou un ami) sur 4 × 50 m",
      "Garde un peu de réserve : Tsahal conseille de ne pas aller jusqu'à l'épuisement à l'entraînement"]};
    if (B === "spec") return { t:"Enchaînement sous fatigue", m:60, tag:"Spécial gibbush · "+T, items:[
      "Échauffement : 10 min",
      n(2,4)+" tours sans pause : 1 km rapide, puis le triangle × 3 avec un sac de "+sk+" kg, 60 s de sac au-dessus de la tête, 20 burpees, 100 m de sprint",
      special(),
      "Le but : rester propre et rapide alors que tu es déjà fatigué, comme le 3e jour d'un gibbush"]};
    return { t:"Dernière simulation, en douceur", m:30, tag:"Spécial gibbush · "+T, items:[
      "Échauffement : 10 min", "Un seul tour du triangle, à 70 %", "Tu gardes ta fraîcheur pour le jour J"]};
  };

  const ruck = () => {
    if (B === "found") return { t:"Marche avec sac", m:30, tag:"Port de charge · "+T, items:[
      "30 min de marche rapide avec un sac à dos de "+kg+" kg (bouteilles d'eau ou livres bien calés)", "Règle les bretelles : le sac doit être collé au dos", "Chaussures déjà faites et chaussettes sèches contre les ampoules"]};
    if (B === "dev") return { t:"Marche avec sac", m:n(45,60), tag:"Port de charge · "+T, items:[
      n(45,60)+" min de marche rapide avec "+kg+" kg, en montée ou sur terrain irrégulier", "Protège tes pieds : chaussettes sèches, pas de chaussures neuves"]};
    const km = n(5,8);
    return { t:"Marche chronométrée", m:km*10, tag:"Port de charge · "+T, items:[
      km+" km avec "+kg+" kg en moins de "+(km*10)+" min (6 km/h, le rythme des marches de gibbush)", "Si tu es en avance, ne cours pas : marche plus vite"]};
  };

  const swim = (hard) => {
    if (B === "found") return { t:"Natation : technique", m:45, tag:"Natation · "+T, items:[
      "Échauffement : 200 m tranquilles",
      "8 × 25 m de crawl en respirant tous les 3 mouvements, des deux côtés",
      "4 × 25 m en rattrapé (une main attend l'autre devant)",
      n(200,400)+" m de crawl continu, sans t'arrêter",
      "Toujours avec un maître-nageur ou un partenaire qui te surveille"]};
    if (B === "dev") return hard ? { t:"Natation : fractionné", m:50, tag:"Natation · "+T, items:[
      "Échauffement : 200 m", n(8,12)+" × 50 m de crawl rapide, 20 s de repos",
      "Aller-retour de 100 m sans toucher le bord, comme la nage jusqu'à la bouée du gibbush",
      "Ne fais jamais d'apnée seul : la perte de connaissance sous l'eau arrive sans prévenir"]}
      : { t:"Natation : endurance", m:50, tag:"Natation · "+T, items:[
      "Échauffement : 200 m", n(600,1000)+" m de crawl continu à allure régulière", "4 × 50 m de jambes seules avec une planche"]};
    return hard ? { t:"Natation : allure objectif", m:50, tag:"Natation · "+T, items:[
      "Échauffement : 200 m",
      "400 m chrono : vise "+mmss(milestone("swim400", w))+" (ton palier de la semaine), puis note-le dans Tests",
      "Aisance avec masque et tuba : 4 × 25 m la tête dans l'eau, calmement, sous surveillance",
      "Retour au calme : 100 m dos"]}
      : { t:"Natation : endurance en groupe", m:50, tag:"Natation · "+T, items:[
      "Échauffement : 200 m", n(1000,1500)+" m de crawl continu", "Si tu peux, nage à plusieurs côte à côte : au gibbush on nage en groupe"]};
  };

  const mobility = () => ({ t:"Mobilité et récupération", m:20, tag:"Facultatif", opt:true, items:[
    "20 min d'étirements : hanches, ischios, mollets, épaules",
    "Rouleau de massage ou balle de tennis sous les pieds et les mollets",
    "Dors au moins 8 h cette nuit : c'est là que tu progresses"]});

  const testDay = () => {
    const list = ["2 km chrono", "pompes 2 min", "abdos 2 min", "tractions max"];
    if (S.unit === "tsanhanim") list.push("3 km chrono un autre jour");
    if (p.swim >= 2) list.push("400 m de nage un autre jour");
    return { t:"Jour de tests", m:45, tag:"Bilan", items:[
      "Échauffement : 10 min de footing lent",
      "Passe tes tests : "+list.join(", ")+". Repos de 10 min après le 2 km",
      "Note tout dans l'onglet Tests : tes paliers et tes allures se recalculent à partir de tes nouveaux résultats",
      "Palier visé cette semaine : 2 km en "+mmss(t2k)+", "+pu+" pompes, "+su+" abdos, "+pl+" tractions"]};
  };
  const mini = () => ({ t:"Mini-gibbush à la maison", m:60, tag:"Test de résistance", items:[
    "Échauffement : 10 min",
    "Enchaîne : 1 km rapide, 20 burpees, 3 triangles avec sac, 20 m de reptation, 1 km rapide",
    "2 min de repos, puis recommence. "+(L === 0 ? "2" : L === 1 ? "3" : "4")+" tours au total",
    "Demande à un ami de te donner les ordres sans prévenir, comme au gibbush"]});
  const taperDay = () => ({ t:"Repos actif", m:20, tag:"Avant le gibbush", items:[
    "15 min de footing très lent et quelques étirements, pas plus",
    "Prépare tes affaires, mange normalement, bois beaucoup",
    "Couche-toi tôt. Tu es prêt : maintenant tu récupères"]});

  let days;
  if (p.swim >= 2)                   days = [intervals(), swim(false), strength(), gibbushSim(), longRun(), swim(true)];
  else if (p.str >= 3 && p.end <= 1) days = [intervals(), strength(true), tempo(), gibbushSim(), strength(true), mobility()];
  else                               days = [intervals(), strength(), longRun(), gibbushSim(), (p.carry >= 3 && w % 2) ? ruck() : tempo(), mobility()];
  if (p.carry >= 3 && p.end >= 3 && w % 2 === 0 && !light && B !== "taper") days[5] = ruck();
  if (light){ days[3] = mini(); days[4] = testDay(); }
  if (B === "taper"){ days[4] = taperDay(); days[5] = mobility(); }
  return days;
}

function render(){
  $("tabs").hidden = !S;
  if (!S) return renderSetup();
  if (tab === "prog") renderProg();
  else if (tab === "tests") renderTests();
  else if (tab === "moi") renderMoi();
  else renderGib();
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
}

    $("go").onclick = () => { draft.step = 0; renderSetup(); window.scrollTo(0,0); };
    $("imp0").onchange = e => { if (e.target.files[0]) importBackup(e.target.files[0]); };

    h += '<h2 style="margin-top:0">Quelle unité tu vises ?</h2><p class="muted">Ton programme dépend de ce choix : natation pour la Shayetet, port de charge pour l\'infanterie, force pour les blindés…</p>';

      if (u.cat !== cat){ if (cat) h += "</div>"; cat = u.cat; h += '<div class="eyebrow cat">'+esc(cat)+'</div><div class="units">'; }
      h += '<button class="unit'+(draft.unit===u.id?" sel":"")+'" data-unit="'+u.id+'"><b>'+esc(u.n)+'</b><span class="heb" dir="rtl">'+esc(u.h)+'</span><small>'+esc(u.d)+'</small></button>';
    });
    h += '</div><div style="height:16px"></div><button class="btn" id="next" '+(draft.unit?"":"disabled")+'>Continuer</button>';
  } else if (st === 1){
    h += '<h2 style="margin-top:0">Ton niveau aujourd\'hui</h2><p class="muted">Sois honnête : le programme part de là où tu en es. Si tu ne sais pas, laisse vide et on commence doucement.</p>'
      + '<label for="run">Ton temps sur 2 km (minutes:secondes)</label><input id="run" inputmode="numeric" placeholder="Ex. 9:30" value="'+esc(draft.run)+'">'
      + '<label for="push">Pompes d\'affilée, sans t\'arrêter</label><input id="push" inputmode="numeric" placeholder="Ex. 25" value="'+esc(draft.push)+'">'
      + '<div style="height:18px"></div><div class="row"><button class="btn2" id="back">Retour</button><button class="btn" id="next">Continuer</button></div>';
  } else {
    h += '<h2 style="margin-top:0">Quand est ton gibbush ?</h2><p class="muted">Le programme dure entre 4 et 16 semaines et se cale sur cette date. La dernière semaine est allégée pour que tu arrives frais.</p>'
      + '<label for="date">Date du gibbush (ou du giyous)</label><input id="date" type="date" value="'+esc(draft.date)+'">'
      + '<p class="muted" id="wk"></p>'
      + '<div class="row"><button class="btn2" id="back">Retour</button><button class="btn" id="next">Créer mon programme</button></div>';
  }
  $("app").innerHTML = h;
  document.querySelectorAll("[data-unit]").forEach(b => b.onclick = () => { draft.unit = b.dataset.unit; renderSetup(); });
  const back = $("back"); if (back) back.onclick = () => { draft.step--; renderSetup(); };
  if (st === 1){ $("run").oninput = e => draft.run = e.target.value; $("push").oninput = e => draft.push = e.target.value; }
  if (st === 2){

function curWeek(){ return Math.max(1, Math.min(S.weeks, Math.floor((Date.now() - S.start)/(7*DAY)) + 1)); }

function heroHTML(){
  const u = unitOf(S.unit);
  let cnt;
  if (S.gibDate){
    const d = Math.ceil((new Date(S.gibDate+"T08:00") - Date.now())/DAY);
    cnt = d > 0 ? '<b>J-'+d+'</b><small>avant le gibbush</small>' : '<b>GO</b><small>c\'est le moment</small>';
  } else cnt = '<b>S'+curWeek()+'</b><small>sur '+S.weeks+' semaines</small>';
  return '<div class="hero"><div><div class="eyebrow">Objectif · niveau '+["débutant","intermédiaire","avancé"][S.level]+'</div><h1>'+esc(u.n)+'</h1><div class="heb" dir="rtl" style="color:var(--sand)">'+esc(u.h)+'</div></div><div class="count">'+cnt+'</div></div>';
}

function renderProg(){
  if (viewWeek === null) viewWeek = curWeek();
  const w = viewWeek, B = blockOf(w, S.weeks), light = isLight(w, S.weeks), days = week(w);
  const total = S.weeks*5, done = Object.keys(S.done).filter(k => !k.endsWith("d5")).length;
  const BLOCK_TXT = { found:"Tu construis la base : technique, souffle, versions faciles des exercices.",
    dev:"Tu montes en volume et en intensité : exercices plus durs, premiers sacs et brancards.",
    spec:"Tu travailles comme au gibbush : allure objectif, enchaînements sous fatigue, épreuves de ton unité.",
    taper:"Tu réduis tout pour arriver frais et en pleine forme." };
  // Phases du programme, pour la frise
  const phases = []; for (let i = 1; i <= S.weeks; i++) phases.push(blockOf(i, S.weeks));
  const strip = '<div class="strip">'+phases.map((b,i) => '<i class="'+b+(i+1===w?" cur":"")+'" title="'+BLOCKS[b]+'"></i>').join("")+'</div>';
  const goals = [["run2k","2 km",true],["pushups","pompes"],["situps","abdos"],["pullups","tractions"]];
  if (S.unit === "tsanhanim") goals.push(["run3k","3 km",true]);
  if (unitOf(S.unit).p.swim >= 2) goals.push(["swim400","400 m nage",true]);
  const gl = goals.map(([id,lab,time]) => { const v = milestone(id, w), g = finalGoal(id);
    return '<div><small>'+lab+'</small><b>'+(time?mmss(v):v)+'</b><span>objectif '+(time?mmss(g):g)+'</span></div>'; }).join("");
  let h = heroHTML() + (w === curWeek() ? todayHTML(w, days) : "") + nudgeHTML()
    + '<div class="card"><div class="row between"><button class="btn2" id="prev" aria-label="Semaine précédente">‹</button><div style="text-align:center"><h3>Semaine '+w+' / '+S.weeks+'</h3><span class="phase '+B+'">'+BLOCKS[B]+(light?" · allégée + tests":"")+'</span></div><button class="btn2" id="nxt" aria-label="Semaine suivante">›</button></div>'
    + strip + '<p class="muted" style="margin:8px 0 0">'+BLOCK_TXT[B]+'</p></div>'
    + '<div class="card"><div class="eyebrow">Tes paliers cette semaine</div><div class="goals">'+gl+'</div>'
    + '<p class="muted" style="margin:10px 0 0">Calculés entre ton dernier résultat et l\'objectif de ton unité. Note tes nouveaux tests : tout se recalcule.</p>'
    + (goals.some(([id]) => goalTooFar(id)) ? '<p class="muted" style="margin:8px 0 0;color:var(--sand)">Pour certains tests, l\'objectif de ton unité est trop loin pour ta date si tu veux progresser sans te blesser. Le programme vise donc la meilleure progression réaliste. Continue après ton gibbush, ou commence plus tôt si tu le peux.</p>' : '')
    + '</div>'
    + '<div class="card"><div class="bar" style="margin-top:0"><i style="width:'+Math.min(100,Math.round(done/total*100))+'%"></i></div><div class="muted">'+done+' séances faites sur '+total+(w===curWeek()?" · semaine en cours":"")+'</div></div>';
  days.forEach((s, i) => {
    const key = "w"+w+"d"+i, ok = !!S.done[key];
    h += '<details class="card'+(ok?" done":"")+(s.opt?" opt":"")+'"><summary><div class="day">'+DAYS[i]+'</div><div class="st"><span class="tag">'+esc(s.tag)+'</span><b>'+esc(s.t)+'</b><small>~'+s.m+' min</small></div><div class="tick">'+(ok?"✓":"")+'</div></summary>'
      + '<div class="sb"><ol>'+s.items.map(x => '<li>'+esc(x)+'</li>').join("")+'</ol><div class="row">'+(ok?'':'<button class="btn" style="width:auto" data-play="'+w+','+i+'">▶ Démarrer</button>')+'<button class="btn2" data-done="'+key+'">'+(ok?"Annuler":"Séance faite ✓")+'</button></div></div></details>';
  });
  h += '<p class="muted">Vendredi est facultatif. Shabbat : repos complet.</p>';
  $("app").innerHTML = h;
  $("prev").onclick = () => { viewWeek = Math.max(1, w-1); renderProg(); };
  $("nxt").onclick = () => { viewWeek = Math.min(S.weeks, w+1); renderProg(); };
  document.querySelectorAll("[data-play]").forEach(b => b.onclick = () => { const [pw, pi] = b.dataset.play.split(",").map(Number); openPlayer(pw, pi); });
  const ni = $("nudgeInstall"); if (ni) ni.onclick = doInstall;
  const nl = $("nudgeLater"); if (nl) nl.onclick = () => { S.noInstall = true; save(); renderProg(); };
  document.querySelectorAll("[data-done]").forEach(b => b.onclick = () => {
    const k = b.dataset.done;
    if (S.done[k]) delete S.done[k]; else { S.done[k] = Date.now(); toast("Séance validée"); buzz(); checkBadges(); }
    save(); renderProg();
    const d = document.querySelector('[data-done="'+k+'"]'); if (d) d.closest("details").open = true;
  });
}

function spark(vals, lower){
  if (vals.length < 2) return "";
  const W=300, H=46, pad=5, mn=Math.min(...vals), mx=Math.max(...vals), span=(mx-mn)||1;
  const pts = vals.map((v,i)=>{ const x=pad+i*(W-2*pad)/(vals.length-1); let y=(v-mn)/span; if(!lower) y=1-y; return [x, pad+y*(H-2*pad)]; });
  const line = pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const last = pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><polyline points="'+line+'" fill="none" stroke="var(--sand)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="4" fill="var(--sig)"/></svg>';
}

function renderTests(){
  const u = unitOf(S.unit);
  let h = heroHTML() + '<h2>Tests</h2><p class="muted">Refais-les pendant les semaines allégées. Le test de référence de Tsahal s\'appelle le Bar-Or : 2 km de course, pompes et abdos. Tsahal ne publie pas de barème officiel par unité : les objectifs ci-dessous sont des repères tirés de sites de prépa et de témoignages (score maximal cité : moins de 7 min, 75 pompes, 85 abdos). <a href="http://sonicinbeijing.blogspot.com/2009/10/yom-hasayerot.html" target="_blank" rel="noopener" style="color:var(--sand)">Source</a></p>';
  TESTS.filter(t => !t.only || t.only.includes(u.id)).forEach(t => {
    const vals = S.tests.filter(x => x.id === t.id).map(x => x.v);
    const best = vals.length ? (t.lower ? Math.min(...vals) : Math.max(...vals)) : null;
    const goal = t.t ? t.t[u.tier] : null, ok = goal !== null && best !== null && (t.lower ? best <= goal : best >= goal);
    const fmt = v => t.time ? mmss(v) : v;
    const right = goal === null
      ? '<b>–</b><div class="muted">pas de barème public</div>'
      : '<b class="'+(ok?"ok":"")+'">'+fmt(goal)+'</b><div class="muted">'+(ok?"atteint ✓":best===null?"à tester":(t.lower?"encore "+mmss(best-goal):"encore "+(goal-best)+" rép."))+'</div>';
    h += '<div class="card"><div class="tgrid"><div><div class="eyebrow">'+esc(t.n)+'</div><b>'+(best===null?"–":fmt(best))+'</b><div class="muted">record</div></div>'
      + '<div style="text-align:right"><div class="eyebrow">Objectif</div>'+right+'</div></div>'
      + '<div class="muted" style="margin-top:6px">Palier de cette semaine : <b style="color:var(--fg)">'+fmt(milestone(t.id, curWeek()))+'</b></div>'
      + (t.note ? '<div class="muted" style="margin-top:6px">'+esc(t.note)+'</div>' : '')
      + spark(vals, t.lower)
      + '<div class="row" style="margin-top:10px"><input id="in-'+t.id+'" inputmode="numeric" placeholder="'+(t.time?"Temps, ex. 8:45":"Répétitions, ex. 42")+'" aria-label="'+esc(t.n)+'"><button class="btn2" data-add="'+t.id+'">Noter</button></div></div>';
  });
  $("app").innerHTML = h;
  document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
    const t = TESTS.find(x => x.id === b.dataset.add), inp = $("in-"+t.id);
    const v = t.time ? parseTime(inp.value) : (/^\d{1,3}$/.test(inp.value.trim()) ? +inp.value : null);
    if (!v){ inp.value=""; inp.placeholder = t.time ? "Format minutes:secondes, ex. 8:45" : "Écris un nombre, ex. 42"; inp.focus(); return; }
    S.tests.push({id:t.id, v, d:Date.now()}); save(); toast("Résultat noté : tes paliers sont recalculés"); renderTests(); checkBadges();
  });
}

  const li = a => '<ul class="focus">'+a.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>';
  let h = heroHTML()

function weekDone(w){ return [0,1,2,3,4].filter(i => S.done["w"+w+"d"+i]).length; }
function stats(){
  const cw = curWeek(), total = Object.keys(S.done).length;
  let streak = weekDone(cw) >= 4 ? 1 : 0;
  for (let w = cw-1; w >= 1; w--){ if (weekDone(w) >= 4) streak++; else break; }
  let fullWeek = false; for (let w = 1; w <= S.weeks; w++) if (weekDone(w) === 5) fullWeek = true;
  const testsAfter = S.tests.filter(t => t.d - S.created > 36e5).length;
  let pr = false, goal = false;
  TESTS.forEach(t => {
    if (t.only && !t.only.includes(S.unit)) return;
    const v = S.tests.filter(x => x.id === t.id).map(x => x.v);
    for (let i = 1; i < v.length; i++){ const prev = t.lower ? Math.min(...v.slice(0,i)) : Math.max(...v.slice(0,i)); if (t.lower ? v[i] < prev : v[i] > prev) pr = true; }
    const g = goalOf(t.id); if (g !== null && v.length && (t.lower ? Math.min(...v) <= g : Math.max(...v) >= g)) goal = true;
  });
  const B = blockOf(cw, S.weeks);
  return { total, streak, fullWeek, testsAfter, pr, goal, spec: B === "spec" || B === "taper" };
}
const BADGES = [
  ["first","Premier pas","Ta première séance", s => s.total >= 1],
  ["s10","10 séances","10 séances faites", s => s.total >= 10],
  ["s25","25 séances","25 séances faites", s => s.total >= 25],
  ["s50","50 séances","50 séances faites", s => s.total >= 50],
  ["week","Semaine pleine","Les 5 séances d'une semaine", s => s.fullWeek],
  ["streak3","Régulier","3 semaines d'affilée avec 4 séances ou plus", s => s.streak >= 3],
  ["test","Premier bilan","Un test noté pendant le programme", s => s.testsAfter >= 1],
  ["pr","Record battu","Tu as battu un de tes records", s => s.pr],
  ["goal","Niveau unité","Un objectif de ton unité atteint", s => s.goal],
  ["spec","Mode gibbush","Tu es entré dans la phase Spécifique", s => s.spec],
];
function checkBadges(){

let player = null, tickT = null, wakeL = null, actx = null;
function beep(){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .3, .6].forEach(t => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.3, actx.currentTime+t); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+t+.22); o.start(actx.currentTime+t); o.stop(actx.currentTime+t+.24); });
  }catch(e){}
}
async function openPlayer(w, i){
  player = { w, i, s: week(w)[i], step:0, start:Date.now(), restEnd:0, finished:false };
  try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); }catch(e){}
  try{ wakeL = await navigator.wakeLock?.request("screen"); }catch(e){}

}
function closePlayer(){

  player = null; $("player").hidden = true; $("player").innerHTML = ""; document.body.style.overflow = ""; render();
}
function restChoices(text){
  const out = [], m = text.match(/(\d+)\s*s\b/), m2 = text.match(/(\d+)\s*min de (repos|récup)/);
  if (m && +m[1] >= 15 && +m[1] <= 180) out.push(+m[1]);
  if (m2) out.push(+m2[1]*60);
  [30,60,90,120].forEach(v => { if (!out.includes(v)) out.push(v); });
  return out.slice(0, 4);
}
function renderPlayer(){
  const p = player, s = p.s, n = s.items.length;
  let h = '<div class="pl-top"><button class="btn2" id="plQuit">✕ Quitter</button><b id="plClock" class="pl-clock">0:00</b></div>';

    h += '<div class="pl-body"><div class="eyebrow">Séance terminée · '+min+' min</div><h1 style="margin-top:6px">Bravo.</h1><p>'+esc(s.t)+'</p>'
      + '<h2>Comment c\'était ?</h2><p class="muted">Ta réponse règle l\'intensité de tes prochaines séances.</p>'
      + '<div class="pl-fb"><button class="btn2" data-fb="easy">Trop facile</button><button class="btn" data-fb="ok">Bien</button><button class="btn2" data-fb="hard">Trop dur</button></div></div>';
  } else {
    h += '<div class="pl-body"><div class="eyebrow">'+esc(s.tag)+'</div><h2 style="margin-top:4px">'+esc(s.t)+'</h2>'
      + '<div class="pl-dots">'+s.items.map((_, k) => '<i class="'+(k < p.step ? "d" : k === p.step ? "c" : "")+'"></i>').join("")+'</div>'
      + '<div class="pl-step"><small>Étape '+(p.step+1)+' sur '+n+'</small><p>'+esc(s.items[p.step])+'</p></div>'
      + '<div class="pl-rest" id="plRest"></div></div>'
      + '<div class="pl-nav"><button class="btn2" id="plPrev" '+(p.step ? "" : "disabled")+'>‹ Retour</button><button class="btn" id="plNext">'+(p.step === n-1 ? "Terminer la séance" : "Étape suivante ›")+'</button></div>';
  }
  $("player").innerHTML = h;
  $("plQuit").onclick = closePlayer;
  if (p.finished) document.querySelectorAll("[data-fb]").forEach(b => b.onclick = () => finishSession(b.dataset.fb));
  else {
    $("plPrev").onclick = () => { p.step--; p.restEnd = 0; renderPlayer(); };
    $("plNext").onclick = () => { p.restEnd = 0; if (p.step < n-1) p.step++; else p.finished = true; renderPlayer(); };

}
function renderRest(){
  const p = player, el = $("plRest"); if (!el) return;
  if (p.restEnd){
    el.innerHTML = '<div class="pl-timer" id="plTimer"></div><button class="btn2" id="plStop">Arrêter le minuteur</button>';

function tick(){

function finishSession(fb){

  S.fb = (S.fb || []).concat({ k:key, f:fb, d:Date.now() }).slice(-60);
  save(); closePlayer();
  toast(fb === "easy" ? "Séance validée. On monte d'un cran" : fb === "hard" ? "Séance validée. On allège un peu" : "Séance validée");
  buzz(); checkBadges();
}

function chevron(x, ox, oy, sc, dy){
  const P = [[136,150],[256,230],[376,150],[376,220],[256,300],[136,220]];
  x.beginPath(); P.forEach(([a,b], i) => { const px = ox + (a-136)*sc, py = oy + (b-150+dy)*sc; i ? x.lineTo(px, py) : x.moveTo(px, py); }); x.closePath(); x.fill();
}

function icsEsc(s){ return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n"); }
function icsFold(l){ const out = []; while (l.length > 50){ out.push(l.slice(0, 50)); l = " " + l.slice(50); } out.push(l); return out.join("\r\n"); }
function exportCalendar(){
  const [hh, mi] = (S.remind || "06:30").split(":").map(Number), pad = v => String(v).padStart(2, "0");
  const loc = d => d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00";
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15)+"Z", now = new Date();
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Tsav//Programme//FR","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Tsav"];
  let count = 0;
  for (let w = curWeek(); w <= S.weeks; w++) week(w).forEach((s, i) => {
    if (s.opt) return;
    const d = sessionDate(w, i); d.setHours(hh, mi, 0, 0); if (d < now) return;
    const e = new Date(d.getTime() + s.m*60000);
    L.push("BEGIN:VEVENT", "UID:tsav-"+S.created+"-w"+w+"d"+i, "DTSTAMP:"+stamp, "DTSTART:"+loc(d), "DTEND:"+loc(e),
      icsFold("SUMMARY:"+icsEsc("Tsav · "+s.t)),
      icsFold("DESCRIPTION:"+icsEsc(s.items.map((x, k) => (k+1)+". "+x).join("\n")+"\n\nOuvre Tsav pour la séance guidée : "+APP_URL)),
      "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:"+icsEsc("Séance Tsav dans 10 min"), "TRIGGER:-PT10M", "END:VALARM", "END:VEVENT");
    count++;
  });
  L.push("END:VCALENDAR");
  if (!count){ toast("Aucune séance à venir à ajouter"); return; }
  downloadBlob(new Blob([L.join("\r\n")], { type:"text/calendar" }), "tsav-seances.ics");
  toast(count+" séances prêtes : ouvre le fichier pour les ajouter à ton agenda");
}

      const o = JSON.parse(r.result), d = o && o.app === "tsav" ? o.data : null;
      if (!d || !unitOf(d.unit) || !d.weeks || !d.start) throw 0;
      S = d; normalize(); save(); tab = "prog"; viewWeek = null; render(); window.scrollTo(0,0); toast("Sauvegarde restaurée");
    }catch(e){ toast("Ce fichier n'est pas une sauvegarde Tsav"); }
  };
  r.readAsText(file);
}

// ================= Onglet Moi =================
function renderMoi(){
  const st = stats();
  const adj = S.adj || 1, adjTxt = adj > 1.001 ? "+"+Math.round((adj-1)*100)+" %" : adj < .999 ? "−"+Math.round((1-adj)*100)+" %" : "normale";
  let h = heroHTML()
    + '<div class="mstats"><div><b>'+st.total+'</b><small>séances faites</small></div><div><b>'+st.streak+'</b><small>semaine'+(st.streak > 1 ? "s" : "")+' d\'affilée</small></div><div><b>'+S.badges.length+'/'+BADGES.length+'</b><small>badges</small></div></div>'
    + '<h2>Badges</h2><div class="badges">'+BADGES.map(([id, name, desc]) => { const on = S.badges.includes(id);
        return '<div class="badge'+(on ? " on" : "")+'"><i>'+(on ? "🏅" : "🔒")+'</i><b>'+esc(name)+'</b><small>'+esc(desc)+'</small></div>'; }).join("")+'</div>'
    + '<h2>Partager</h2><div class="card"><p class="muted" style="margin-top:0">Une image de ta progression, prête pour Instagram, TikTok ou WhatsApp.</p>'
    + '<button class="btn" id="shareImg">Partager ma progression</button><div style="height:8px"></div><button class="btn2" id="invite" style="width:100%">Inviter un ami à s\'entraîner avec moi</button></div>'
    + '<h2>Rappels</h2><div class="card"><p class="muted" style="margin-top:0">Ajoute toutes tes séances à venir dans l\'agenda de ton téléphone, avec une alerte 10 min avant. Refais-le si ton programme change.</p>'
    + '<label for="rtime" style="margin-top:0">Heure de tes séances</label><input type="time" id="rtime" value="'+esc(S.remind)+'">'
    + '<p class="muted">Conseil : le matin avant 8 h, à cause de la chaleur.</p><button class="btn" id="ics">Ajouter à mon agenda</button></div>'
    + (isStandalone() ? "" : '<h2>Installer l\'appli</h2><div class="card">'+installHTML()+'</div>')
    + '<h2>Intensité</h2><div class="card"><p style="margin-top:0">Intensité actuelle : <b>'+adjTxt+'</b></p><p class="muted" style="margin-bottom:0">Elle change selon tes réponses à « Comment c\'était ? » à la fin des séances guidées.</p></div>'
    + '<h2>Sauvegarde</h2><div class="card"><p class="muted" style="margin-top:0">Tes données restent sur ce téléphone, sans compte. Avant de changer de téléphone ou d\'effacer ton navigateur, télécharge une sauvegarde.</p>'
    + '<div class="row"><button class="btn2" id="exp">Télécharger</button><label class="btn2 file">Restaurer<input type="file" id="imp" accept="application/json,.json" hidden></label></div></div>'
    + '<h2>Réglages</h2><div class="card"><p class="muted" style="margin-top:0">Changer d\'unité ou de date recrée le programme. Tes résultats de tests et tes badges sont gardés.</p><button class="btn2" id="reset">Changer d\'unité ou de date</button>'
    + '<div id="confirm" hidden style="margin-top:10px"><p>Ton programme actuel et les séances cochées seront remplacés.</p><div class="row"><button class="btn2" id="no">Annuler</button><button class="btn" id="yes">Oui, recommencer</button></div></div></div>'
    + '<h2>À propos</h2><div class="card muted">Tsav est gratuit, sans publicité et sans compte. Aucune donnée ne quitte ton téléphone. Tsav n\'est pas affilié à Tsahal et ne remplace ni un médecin ni un entraîneur. Les objectifs sont des repères, pas des barèmes officiels.</div>';
  $("app").innerHTML = h;
  $("shareImg").onclick = shareCard;
  $("invite").onclick = invite;
  $("rtime").onchange = e => { S.remind = e.target.value || "06:30"; save(); };
  $("ics").onclick = exportCalendar;
  const ib = $("install"); if (ib) ib.onclick = doInstall;
  $("exp").onclick = exportBackup;
  $("imp").onchange = e => { if (e.target.files[0]) importBackup(e.target.files[0]); };
  $("reset").onclick = () => { $("confirm").hidden = false; };
  $("no").onclick = () => { $("confirm").hidden = true; };
  $("yes").onclick = () => {
    keptTests = S.tests; keptBadges = S.badges;
    draft = { step:0, unit:S.unit, run:"", push:"", date:S.gibDate || "" }; S = null; save(); tab = "prog"; render(); window.scrollTo(0,0);
  };
}

let keptBadges = null;
let keptTests = null;
// Récupère les tests après une recréation du programme
const _save = save;
save = function(){
  if (S && keptTests){ S.tests = keptTests.concat(S.tests); keptTests = null; }
  if (S && keptBadges){ S.badges = Array.from(new Set(keptBadges.concat(S.badges || []))); keptBadges = null; }
  _save();
};

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0,0); });
normalize();
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
